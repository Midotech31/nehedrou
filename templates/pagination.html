{% load i18n %}{% if page.has_other_pages %}<nav class="pagination" aria-label="{% translate 'Pagination' %}">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&variety={{ selected|urlencode }}&q={{ query|urlencode }}&content_language={{ content_language|urlencode }}&status={{ selected_status|urlencode }}&state={{ selected_state|urlencode }}">{% translate "Previous" %}</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}&variety={{ selected|urlencode }}&q={{ query|urlencode }}&content_language={{ content_language|urlencode }}&status={{ selected_status|urlencode }}&state={{ selected_state|urlencode }}">{% translate "Next" %}</a>{% endif %}</nav>{% endif %}
