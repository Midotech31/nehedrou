{% load i18n %}{% if page.has_other_pages %}{% querystring page=None as page_filters %}<nav class="pagination" aria-label="{% translate 'Pagination' %}">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}{% if page_filters %}&amp;{{ page_filters|slice:'1:' }}{% endif %}">{% translate "Previous" %}</a>{% endif %}<span>{{ page.number }} / {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}{% if page_filters %}&amp;{{ page_filters|slice:'1:' }}{% endif %}">{% translate "Next" %}</a>{% endif %}</nav>{% endif %}
