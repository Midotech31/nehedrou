{% load i18n %}
<div class="builder-filters"><div><label for="activity-search">{% translate 'Word, meaning or activity' %}</label><input type="search" id="activity-search" data-activity-search placeholder="{% translate 'Search activities' %}"></div>
<div><label for="builder-kind">{% translate 'Activity type' %}</label><select id="builder-kind" data-builder-filter="kind"><option value="">{% translate 'All activity types' %}</option><option value="word_pair">{% translate 'Word exploration' %}</option><option value="phonological_contrast">{% translate 'Phonological contrast' %}</option><option value="vocabulary">{% translate 'Vocabulary and comprehension' %}</option><option value="requests">{% translate 'Requests and choices' %}</option><option value="categories">{% translate 'Categories and associations' %}</option><option value="actions">{% translate 'Actions and verbs' %}</option><option value="relations">{% translate 'Spatial relations' %}</option><option value="routines">{% translate 'Daily routines' %}</option><option value="storytelling">{% translate 'Short stories and conversation' %}</option></select></div>
<div><label for="builder-theme">{% translate 'Theme' %}</label><select id="builder-theme" data-builder-filter="theme"><option value="">{% translate 'All themes' %}</option><option value="home">{% translate 'Home' %}</option><option value="food">{% translate 'Food' %}</option><option value="animals">{% translate 'Animals' %}</option><option value="body">{% translate 'Body' %}</option><option value="clothing">{% translate 'Clothing' %}</option><option value="travel">{% translate 'Travel' %}</option><option value="play">{% translate 'Play' %}</option><option value="daily_life">{% translate 'Everyday life' %}</option><option value="school">{% translate 'School' %}</option><option value="nature">{% translate 'Nature' %}</option><option value="sounds">{% translate 'Sounds' %}</option></select></div>
<div><label for="builder-mode">{% translate 'Response mode' %}</label><select id="builder-mode" data-builder-filter="mode"><option value="">{% translate 'All response modes' %}</option><option value="matching">{% translate 'Requested picture choice' %}</option><option value="free">{% translate 'Free choice without a correctness score' %}</option><option value="observation">{% translate 'Shared observation without a picture answer' %}</option></select></div><button type="button" class="button secondary" data-builder-reset>{% translate 'Reset filters' %}</button></div><p class="muted">{% translate 'Filters do not clear selected activities. Changing the spoken variety does.' %}</p>
