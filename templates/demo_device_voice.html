{% load i18n content_language %}{% get_current_language as interface_language %}<div lang="{{ interface_language }}" dir="{{ interface_language|language_direction }}" class="device-voice" data-device-voice data-language="{% if activity %}{{ activity.device_voice_language }}{% else %}{{ item.activity.device_voice_language }}{% endif %}" data-variety="{% if activity %}{{ activity.variety.code }}{% else %}{{ item.activity.variety.code }}{% endif %}" data-kind="{% if activity %}{{ activity.kind }}{% else %}{{ item.activity.kind }}{% endif %}" data-demo="{% if activity %}{{ activity.is_demo|yesno:'true,false' }}{% else %}{{ item.activity.is_demo|yesno:'true,false' }}{% endif %}" data-missing="{% translate 'No matching voice is installed on this device. A caregiver can read the word.' %}" data-playing="{% translate 'Playing a synthetic demonstration voice' %}" data-ready="{% translate 'Matching device voice available' %}" data-failed="{% translate 'The device voice could not play. A caregiver can read the word.' %}"><button type="button" class="text-button" disabled data-speech-text="{{ word }}">{% translate 'Listen with device voice' %}</button><small>{% translate 'Synthetic device voice · unreviewed' %}</small><small data-speech-voice hidden>{% translate 'Selected device voice language' %}: <bdi data-speech-language lang="und" dir="ltr"></bdi> <span data-speech-accent hidden>{% translate 'The installed voice uses a different regional accent.' %}</span></small><small data-speech-status role="status" aria-live="polite"></small></div>
