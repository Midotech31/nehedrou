{% load i18n %}<div class="probe-media">{% if item.image_asset %}<img src="{% if administration %}{% url 'followup:administration_media' administration.pk item.id 'image' %}{% else %}{% url 'followup:definition_media' definition.pk item.id 'image' %}{% endif %}" alt="{{ item.word }}" width="240" height="240" loading="lazy">{% else %}<p class="muted">{% translate "Image not supplied for this draft" %}</p>{% endif %}{% if item.audio_asset %}<audio controls preload="none" aria-label="{% translate 'Documented model audio' %}"><source src="{% if administration %}{% url 'followup:administration_media' administration.pk item.id 'audio' %}{% else %}{% url 'followup:definition_media' definition.pk item.id 'audio' %}{% endif %}"></audio>{% else %}<p class="muted">{% translate "Model audio not supplied for this draft" %}</p>{% endif %}</div>
