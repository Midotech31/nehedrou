name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_DEBUG: "1"
      DEMO_MODE: "1"
      DEMO_EPHEMERAL: "1"
      DEMO_DATABASE_PATH: ${{ github.workspace }}/.ci-demo.sqlite3
      NEHEDROU_MEDIA_ROOT: ${{ github.workspace }}/.ci-media
      PUBLIC_ORIGIN: https://ci.example.invalid
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext
      - name: Compile catalogues
        run: python scripts/compile_messages.py
      - name: Check translated UI keys
        run: python scripts/check_translations.py
      - name: Verify Arabic review package
        run: python scripts/build_arabic_review_pack.py --check
      - name: Run Django system check
        run: python manage.py check
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run test suite
        run: python manage.py test --verbosity 2
      - name: Build production Docker image
        run: docker build --tag nehedrou-ci:pull-request .
      - name: Smoke test production container startup
        run: |
          set -euo pipefail
          docker run --detach --name nehedrou-ci --publish 127.0.0.1:10000:10000 \
            --env RENDER=true \
            --env DJANGO_DEBUG=0 \
            --env DJANGO_SECRET_KEY=ci-only-not-a-secret-key-with-more-than-fifty-characters \
            --env DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost \
            --env PUBLIC_ORIGIN=https://ci.example.invalid \
            --env DEMO_MODE=1 \
            --env DEMO_EPHEMERAL=1 \
            --env DEMO_SEED_ON_START=0 \
            --env DEMO_DATABASE_PATH=/tmp/nehedrou-ci.sqlite3 \
            --env NEHEDROU_MEDIA_ROOT=/tmp/nehedrou-ci-media \
            --env MFA_REQUIRED=0 \
            nehedrou-ci:pull-request
          trap 'docker rm --force nehedrou-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail \
              --header 'X-Forwarded-Proto: https' \
              http://127.0.0.1:10000/healthz/; then
              exit 0
            fi
            sleep 1
          done
          docker logs nehedrou-ci
          exit 1

  postgres:
    name: PostgreSQL permission and concurrency checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Disposable runner-local database only; never import production credentials.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nehedrou_ci
          POSTGRES_USER: nehedrou_ci
          POSTGRES_PASSWORD: ci-only-disposable-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nehedrou_ci -d nehedrou_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "1"
      DEMO_MODE: "1"
      DEMO_EPHEMERAL: "0"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nehedrou_ci
      POSTGRES_USER: nehedrou_ci
      POSTGRES_PASSWORD: ci-only-disposable-postgres
      NEHEDROU_MEDIA_ROOT: ${{ github.workspace }}/.ci-media-postgres
      PUBLIC_ORIGIN: https://ci.example.invalid
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Compile catalogues
        run: python scripts/compile_messages.py
      - name: Check translated UI keys
        run: python scripts/check_translations.py
      - name: Require a real PostgreSQL connection and row locks
        run: >-
          python manage.py shell -c
          "from django.db import connection;
          connection.ensure_connection();
          assert connection.vendor == 'postgresql';
          assert connection.features.has_select_for_update;
          print('PostgreSQL connection and row locks verified')"
      - name: Run qualification, invoice and PostgreSQL-only regressions
        run: >-
          python manage.py test --noinput --verbosity 2
          qualification
          core.tests_billing_lifecycle
          core.tests_billing_entitlements
          core.test_live_integrity_writes
          core.tests_restore_targets
          core.tests_concurrency.ConcurrentQualificationTests
          core.tests_access_auth.ConcurrentResponsibilityTests
          core.tests_access_auth.ConcurrentAuthThrottleTests
          core.tests_account_onboarding.ConcurrentMFAOnboardingTests
          core.tests_form_scope.PracticeFormScopeConcurrencyTests
          core.tests_operations_views.DatabaseProbeTimeoutTests
          catalog.tests_guided_audio.GuidedAudioConcurrencyTests
          catalog.tests_working_concurrency.WorkingCopyConcurrencyTests
          catalog.tests_editorial_manual_concurrency.ManualEditorialHandoffConcurrencyTests
          followup.tests.FollowupConcurrencyTests
