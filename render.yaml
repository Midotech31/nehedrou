# Durable demonstration configuration, prepared 2026-10-30.
# The existing service uses external Neon PostgreSQL and private object storage.
# Review the exact existing service and environment before any manual sync.
# sync:false prompts only at initial Blueprint creation; it does not fill new keys on an existing service.
# No database, disk, cron service or paid resource is created by this file.
services:
  - type: web
    name: nehedrou-demo
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: "off"
    buildCommand: python scripts/render_build.py
    startCommand: python scripts/render_start.py
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: DJANGO_DEBUG
        value: "0"
      - key: DEMO_MODE
        value: "1"
      - key: DEMO_EPHEMERAL
        value: "0"
      - key: DEMO_SEED_ON_START
        value: "0"
      - key: POSTGRES_SSLMODE
        value: require
      - key: NEHEDROU_MEDIA_BACKEND
        value: s3
      - key: NEHEDROU_MEDIA_DURABLE
        value: "1"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_MIGRATION_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: NEHEDROU_S3_BUCKET
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: MFA_REQUIRED
        sync: false
      - key: EMAIL_BACKEND
        sync: false
# Existing environment keys omitted here are retained by Blueprint sync.
# SMTP values and backup credentials belong in separately reviewed private operator configuration.
